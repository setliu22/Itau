run_name: conv1d_interaction_cnn_cosine

data:
  train_pkl: data/splits/train.pkl
  val_pkl: data/splits/val.pkl
  test_pkl: data/splits/test.pkl

rendering:
  height: 32
  background: black

slicing:
  slice_width: 32
  stride: 16
  remove_padding: false
  pad_to_width: null

model:
  encoder_type: conv1d
  embed_dim: 128
  pooling: mean
  pair_head: interaction_cnn
  interaction_channels: cosine
  interaction_hidden_channels: 32
  interaction_classifier_hidden: 64
  dropout: 0.0

training:
  num_epochs: 20
  batch_size: 64
  lr: 1.0e-3
  num_workers: 4
  seed: 7
